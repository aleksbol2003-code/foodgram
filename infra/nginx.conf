server {
    listen 80;
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        
        # Критически важно: передаём оригинальный Host, IP и протокол
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Увеличиваем таймауты на случай долгих запросов (например, загрузка фото)
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

#    location /admin/ {
#        proxy_pass http://127.0.0.1:8000;
#        proxy_set_header Host $host;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header X-Forwarded-Proto $scheme;
#    }

    # Раздача медиа Django
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # статику админки и DRF отдаёт сам runserver в DEBUG=True
    #location /static/ {
    #   proxy_pass http://127.0.0.1:8000;
    #}

    location /api/docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/redoc.html;
    }
    
    location / {
        root /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
      }

}
